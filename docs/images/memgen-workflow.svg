<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title description">
  <title id="title">MemGen workflow for a video or photo set</title>
  <desc id="description">The private workflow takes a video or photo set and visitor prompt, uses local Qwen for intent and evidence, asks the visitor to approve moments, uses Qwen Image Edit for styling, TRELLIS.2 for meshes, and a private viewer for the result. A separate curated public demonstration uses Omniverse Kit for USD assembly, animation and RTX rendering.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="2"/></marker>
  </defs>
  <rect width="900" height="1000" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="450" y="46" text-anchor="middle" font-size="31" font-weight="700" fill="#152238">From your media to a 3D memory</text>
    <text x="450" y="78" text-anchor="middle" font-size="18" fill="#475569">CURRENT PRIVATE UPLOAD FLOW · LOCAL INFERENCE ON DGX SPARK</text>

    <rect x="80" y="108" width="740" height="84" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="113" cy="139" r="18" fill="#2563eb"/><text x="113" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="146" y="145" font-size="23" font-weight="700" fill="#172338">Video or photos + visitor prompt</text>
    <text x="108" y="174" font-size="18" fill="#334155">Say what to preserve, exclude, and change creatively.</text>
    <path d="M450 193 V211" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="80" y="220" width="740" height="84" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="113" cy="251" r="18" fill="#7c3aed"/><text x="113" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="146" y="257" font-size="23" font-weight="700" fill="#172338">Local Qwen: intent + source evidence</text>
    <text x="108" y="286" font-size="18" fill="#334155">Inspect frames or photos; propose moments and note uncertainty.</text>
    <path d="M450 305 V323" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="80" y="332" width="740" height="84" rx="14" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <circle cx="113" cy="363" r="18" fill="#be185d"/><text x="113" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="146" y="369" font-size="23" font-weight="700" fill="#172338">Visitor reviews and approves</text>
    <text x="108" y="398" font-size="18" fill="#334155">Choose moments, appearance, lighting, and save notes.</text>
    <path d="M450 417 V435" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="80" y="444" width="740" height="84" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <circle cx="113" cy="475" r="18" fill="#c2410c"/><text x="113" y="482" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <text x="146" y="481" font-size="23" font-weight="700" fill="#172338">Qwen Image Edit: style references</text>
    <text x="108" y="510" font-size="18" fill="#334155">Create source-guided images for each approved moment.</text>
    <path d="M450 529 V547" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="80" y="556" width="740" height="84" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <circle cx="113" cy="587" r="18" fill="#0f766e"/><text x="113" y="594" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
    <text x="146" y="593" font-size="23" font-weight="700" fill="#172338">TRELLIS.2: generate textured meshes</text>
    <text x="108" y="622" font-size="18" fill="#334155">Infer 3D geometry and export GLB assets.</text>
    <path d="M450 641 V659" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="80" y="668" width="740" height="84" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <circle cx="113" cy="699" r="18" fill="#4338ca"/><text x="113" y="706" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text>
    <text x="146" y="705" font-size="23" font-weight="700" fill="#172338">Private interactive 3D viewer</text>
    <text x="108" y="734" font-size="18" fill="#334155">Rotate, zoom, change lighting, and compare source images.</text>

    <rect x="80" y="798" width="740" height="148" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="108" y="830" font-size="18" font-weight="700" fill="#475569">SEPARATE CURATED PUBLIC DEMONSTRATION</text>
    <text x="108" y="864" font-size="21" font-weight="700" fill="#172338">Qwen → Qwen Image Edit → TRELLIS.2</text>
    <text x="108" y="894" font-size="18" fill="#334155">Authored choices → Omniverse Kit: USD, animation, RTX</text>
    <text x="108" y="924" font-size="18" fill="#334155">Compact GLBs → public Three.js viewer</text>
    <text x="450" y="981" text-anchor="middle" font-size="16" fill="#475569">Omniverse is used in the published sample, not the private upload generation path.</text>
  </g>
</svg>
